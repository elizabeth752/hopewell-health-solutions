<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="tstitle tsdesc" font-family="Arial, Helvetica, sans-serif">
  <title id="tstitle">What triggers postpartum anger</title>
  <desc id="tsdesc">Six common triggers often stack up at once: sleep loss, the mental load of running a household, too little support, a hard or traumatic birth, hormone and thyroid changes, and a past history of depression or anxiety.</desc>
  <rect width="1100" height="480" fill="#ffffff"/>

  <text x="50" y="52" font-size="20" font-weight="700" fill="#001d37">Postpartum anger rarely has a single cause</text>
  <text x="50" y="78" font-size="14" fill="#5a6b7a">Several of these triggers often stack up at once</text>

  <!-- ascending dashed guide -->
  <path d="M95 392 L247 358 L399 324 L551 290 L703 256 L855 222" fill="none" stroke="#b6863c" stroke-width="2" stroke-dasharray="1,8" stroke-linecap="round"/>

  <!-- 6 ascending bars -->
  <g>
    <rect x="60" y="322" width="110" height="98" rx="6" fill="#e7eef5"/>
    <rect x="60" y="322" width="110" height="98" rx="6" fill="none" stroke="#265489" stroke-width="2"/>
    <text x="115" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#265489">1</text>
    <text x="115" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Sleep loss</text>
  </g>

  <g>
    <rect x="212" y="288" width="110" height="132" rx="6" fill="#f3e8d2"/>
    <rect x="212" y="288" width="110" height="132" rx="6" fill="none" stroke="#b6863c" stroke-width="2"/>
    <text x="267" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#b6863c">2</text>
    <text x="267" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">The mental</text>
    <text x="267" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">load</text>
  </g>

  <g>
    <rect x="364" y="254" width="110" height="166" rx="6" fill="#e7eef5"/>
    <rect x="364" y="254" width="110" height="166" rx="6" fill="none" stroke="#265489" stroke-width="2"/>
    <text x="419" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#265489">3</text>
    <text x="419" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Too little</text>
    <text x="419" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">support</text>
  </g>

  <g>
    <rect x="516" y="220" width="110" height="200" rx="6" fill="#f3e8d2"/>
    <rect x="516" y="220" width="110" height="200" rx="6" fill="none" stroke="#b6863c" stroke-width="2"/>
    <text x="571" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#b6863c">4</text>
    <text x="571" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">A hard or</text>
    <text x="571" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">traumatic birth</text>
  </g>

  <g>
    <rect x="668" y="186" width="110" height="234" rx="6" fill="#e7eef5"/>
    <rect x="668" y="186" width="110" height="234" rx="6" fill="none" stroke="#265489" stroke-width="2"/>
    <text x="723" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#265489">5</text>
    <text x="723" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Hormone &amp;</text>
    <text x="723" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">body changes</text>
  </g>

  <g>
    <rect x="820" y="152" width="110" height="268" rx="6" fill="#f3e8d2"/>
    <rect x="820" y="152" width="110" height="268" rx="6" fill="none" stroke="#b6863c" stroke-width="2"/>
    <text x="875" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b6863c">6</text>
    <text x="875" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Past depression</text>
    <text x="875" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">or anxiety</text>
  </g>

  <text x="1040" y="100" text-anchor="end" font-size="13" fill="#5a6b7a">Each one</text>
  <text x="1040" y="118" text-anchor="end" font-size="13" fill="#5a6b7a">adds weight</text>
</svg>
