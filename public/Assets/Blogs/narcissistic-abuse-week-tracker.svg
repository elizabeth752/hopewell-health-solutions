<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="320" rx="24" fill="#f5f2eb"/>

  <text x="500" y="56" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1" fill="#001d37">ONE THERAPY HOUR A WEEK</text>

  <!-- 7-day row -->
  <g font-size="13" font-weight="700">
    <!-- day 1: session, filled -->
    <circle cx="140" cy="150" r="34" fill="#1b3e63"/>
    <text x="140" y="157" text-anchor="middle" fill="#ffffff" font-size="15">Mon</text>
    <text x="140" y="205" text-anchor="middle" fill="#1b3e63">Session</text>

    <!-- days 2-7: outline, unsupported -->
    <circle cx="260" cy="150" r="34" fill="none" stroke="#c9cfd6" stroke-width="2.5"/>
    <text x="260" y="157" text-anchor="middle" fill="#9aa5ae" font-size="15">Tue</text>
    <circle cx="380" cy="150" r="34" fill="none" stroke="#c9cfd6" stroke-width="2.5"/>
    <text x="380" y="157" text-anchor="middle" fill="#9aa5ae" font-size="15">Wed</text>
    <circle cx="500" cy="150" r="34" fill="none" stroke="#c9cfd6" stroke-width="2.5"/>
    <text x="500" y="157" text-anchor="middle" fill="#9aa5ae" font-size="15">Thu</text>
    <circle cx="620" cy="150" r="34" fill="none" stroke="#c9cfd6" stroke-width="2.5"/>
    <text x="620" y="157" text-anchor="middle" fill="#9aa5ae" font-size="15">Fri</text>
    <circle cx="740" cy="150" r="34" fill="none" stroke="#c9cfd6" stroke-width="2.5"/>
    <text x="740" y="157" text-anchor="middle" fill="#9aa5ae" font-size="15">Sat</text>
    <circle cx="860" cy="150" r="34" fill="none" stroke="#c9cfd6" stroke-width="2.5"/>
    <text x="860" y="157" text-anchor="middle" fill="#9aa5ae" font-size="15">Sun</text>
  </g>

  <!-- brace under the 6 unsupported days -->
  <path d="M240,205 Q500,235 880,205" fill="none" stroke="#b6863c" stroke-width="2.5"/>
  <text x="560" y="264" text-anchor="middle" font-size="22" font-weight="700" fill="#b6863c">6 of 7 days</text>
  <text x="560" y="290" text-anchor="middle" font-size="14" fill="#5a6b7a">for avoidance to rebuild, unsupported</text>
</svg>
