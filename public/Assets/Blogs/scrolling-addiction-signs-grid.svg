<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="380" rx="24" fill="#f5f2eb"/>

  <text x="500" y="42" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#b6863c">WARNING SIGNS THE APA SAYS TO TAKE SERIOUSLY</text>

  <!-- card 1: continuing despite harm -->
  <rect x="60" y="66" width="260" height="176" rx="18" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <g transform="translate(190,128)">
    <path d="M0,-34 L30,24 L-30,24 Z" fill="none" stroke="#265489" stroke-width="4" stroke-linejoin="round"/>
    <line x1="0" y1="-10" x2="0" y2="8" stroke="#265489" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="18" r="2.6" fill="#265489"/>
  </g>
  <text x="190" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#001d37">Continues Despite Harm</text>
  <text x="190" y="210" text-anchor="middle" font-size="11.5" fill="#5a6b7a">relationship strain,</text>
  <text x="190" y="226" text-anchor="middle" font-size="11.5" fill="#5a6b7a">sleep loss, and it keeps going</text>

  <!-- card 2: lying about use -->
  <rect x="370" y="66" width="260" height="176" rx="18" fill="#1b3e63"/>
  <g transform="translate(500,128)">
    <path d="M-32,-20 a10,10 0 0 1 10,-10 h44 a10,10 0 0 1 10,10 v24 a10,10 0 0 1 -10,10 h-34 l-14,14 v-14 h-10 a10,10 0 0 1 -10,-10 Z" fill="#f5f2eb"/>
    <line x1="-34" y1="-24" x2="34" y2="30" stroke="#b6863c" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="500" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Hides How Much</text>
  <text x="500" y="210" text-anchor="middle" font-size="11.5" fill="#e7eef5">telling family or friends</text>
  <text x="500" y="226" text-anchor="middle" font-size="11.5" fill="#e7eef5">less than the real amount</text>

  <!-- card 3: preoccupation / cravings / lost time -->
  <rect x="680" y="66" width="260" height="176" rx="18" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <g transform="translate(810,128)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#265489" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#265489" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="8" stroke="#265489" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="810" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#001d37">Preoccupied, Craving</text>
  <text x="810" y="210" text-anchor="middle" font-size="11.5" fill="#5a6b7a">or losing large blocks</text>
  <text x="810" y="226" text-anchor="middle" font-size="11.5" fill="#5a6b7a">of time to it</text>

  <line x1="80" y1="278" x2="920" y2="278" stroke="#e4ddd0" stroke-width="1.5"/>

  <text x="500" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#b6863c">SMALLER, EVERYDAY TELLS</text>
  <text x="500" y="336" text-anchor="middle" font-size="13" fill="#001d37">Reaching for the phone before fully awake &#183; losing a book's thread after two paragraphs &#183; restless when it's in another room</text>
</svg>
