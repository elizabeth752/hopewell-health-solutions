<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="340" rx="24" fill="#f5f2eb"/>

  <text x="500" y="42" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#b6863c">WHAT OFTEN TRAVELS WITH CSBD</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#5a6b7a">10.8% of a community sample screened positive for probable Compulsive Sexual Behavior Disorder</text>

  <!-- 5 tiles, width 176, gap 12, total 5*176+4*12=928, start x=36 -->
  <!-- Tile 1: ADHD -->
  <rect x="36" y="86" width="176" height="176" rx="16" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <g transform="translate(124,138)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#265489" stroke-width="3"/>
    <line x1="-9" y1="-6" x2="9" y2="6" stroke="#265489" stroke-width="3" stroke-linecap="round"/>
    <line x1="9" y1="-6" x2="-9" y2="6" stroke="#265489" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="124" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">ADHD Symptoms</text>

  <!-- Tile 2: BPD -->
  <rect x="224" y="86" width="176" height="176" rx="16" fill="#1b3e63"/>
  <g transform="translate(312,138)">
    <path d="M0,16 C-19,0 -18,-16 -5,-16 C0,-16 0,-12 0,-12 C0,-12 0,-16 5,-16 C18,-16 19,0 0,16 Z" fill="none" stroke="#f5f2eb" stroke-width="3"/>
  </g>
  <text x="312" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BPD Symptoms</text>

  <!-- Tile 3: Social media -->
  <rect x="412" y="86" width="176" height="176" rx="16" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <g transform="translate(500,138)">
    <rect x="-16" y="-20" width="32" height="40" rx="6" fill="none" stroke="#265489" stroke-width="3"/>
    <line x1="-8" y1="12" x2="8" y2="12" stroke="#265489" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="500" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Social Media Problems</text>

  <!-- Tile 4: Drug use -->
  <rect x="600" y="86" width="176" height="176" rx="16" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <g transform="translate(688,138)">
    <path d="M-11,-18 L11,-18 L7,20 L-7,20 Z" fill="none" stroke="#265489" stroke-width="3" stroke-linejoin="round"/>
    <line x1="-8.5" y1="-3" x2="8.5" y2="-3" stroke="#265489" stroke-width="3"/>
  </g>
  <text x="688" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Drug Use Problems</text>

  <!-- Tile 5: Compulsivity/impulsivity -->
  <rect x="788" y="86" width="176" height="176" rx="16" fill="#1b3e63"/>
  <g transform="translate(876,138)">
    <circle cx="0" cy="0" r="4" fill="#b6863c"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#b6863c" stroke-width="2.5" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#b6863c" stroke-width="2.5" stroke-dasharray="2,6"/>
  </g>
  <text x="876" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Higher Compulsivity</text>
  <text x="876" y="204" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">&amp; Impulsivity</text>

  <text x="500" y="300" text-anchor="middle" font-size="12" fill="#5a6b7a">Treating the pornography use alone, while these run untreated, tends to leave the pattern intact.</text>
</svg>
