<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="pgtitle pgdesc" font-family="Arial, Helvetica, sans-serif">
  <title id="pgtitle">How common are postpartum obsessions and compulsions?</title>
  <desc id="pgdesc">Out of 100 new mothers screened two weeks after birth in one study, about 11 screened positive for OCD, 38 more reported milder obsessions or compulsions that did not reach that level, and 51 reported no such symptoms.</desc>
  <rect width="1100" height="620" fill="#ffffff"/>

  <text x="50" y="50" font-size="20" font-weight="700" fill="#001d37">How common are these thoughts?</text>
  <text x="50" y="76" font-size="14" fill="#5a6b7a">Out of 100 new mothers screened two weeks after birth, in one study</text>

