<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="swtitle swdesc" font-family="Arial, Helvetica, sans-serif">
  <title id="swtitle">Postpartum depression feels heavier than the baby blues</title>
  <desc id="swdesc">The baby blues are a light, passing weight: mood swings, sadness, crying spells. Postpartum depression is a heavier, more constant weight: sadness or emptiness most of the day, nearly every day, that does not lift on its own.</desc>
  <rect width="1100" height="420" fill="#ffffff"/>

  <text x="550" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#001d37">Postpartum depression lasts longer and feels heavier</text>

  <!-- beam -->
  <circle cx="550" cy="130" r="9" fill="#001d37"/>
  <line x1="300" y1="168" x2="800" y2="168" stroke="#5a6b7a" stroke-width="4" stroke-linecap="round" transform="rotate(-6 550 168)"/>
  <line x1="550" y1="139" x2="550" y2="230" stroke="#5a6b7a" stroke-width="4"/>

  <!-- left side: feather (light) -->
  <line x1="318" y1="190" x2="318" y2="236" stroke="#5a6b7a" stroke-width="2"/>
  <g transform="translate(318,268)">
    <circle cx="0" cy="0" r="58" fill="#e7eef5"/>
    <path d="M0,-32 C14,-18 14,18 0,34 C-14,18 -14,-18 0,-32 Z" fill="none" stroke="#265489" stroke-width="2"/>
    <line x1="0" y1="-30" x2="0" y2="32" stroke="#265489" stroke-width="1.5"/>
    <path d="M0,-18 L10,-10 M0,-2 L11,6 M0,14 L9,22" stroke="#265489" stroke-width="1.3" fill="none"/>
    <path d="M0,-18 L-10,-10 M0,-2 L-11,6 M0,14 L-9,22" stroke="#265489" stroke-width="1.3" fill="none"/>
  </g>
  <text x="318" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#001d37">The Baby Blues</text>
  <text x="318" y="372" text-anchor="middle" font-size="12.5" fill="#5a6b7a">Light. Mild. Passes on its own</text>
  <text x="318" y="390" text-anchor="middle" font-size="12.5" fill="#5a6b7a">within about two weeks.</text>

  <!-- right side: stone/anchor (heavy) -->
  <line x1="782" y1="190" x2="782" y2="236" stroke="#5a6b7a" stroke-width="2"/>
  <g transform="translate(782,272)">
    <circle cx="0" cy="0" r="64" fill="#f3e8d2"/>
    <circle cx="0" cy="-30" r="11" fill="none" stroke="#b6863c" stroke-width="3"/>
    <line x1="0" y1="-19" x2="0" y2="30" stroke="#b6863c" stroke-width="4"/>
    <line x1="-26" y1="2" x2="26" y2="2" stroke="#b6863c" stroke-width="4"/>
    <path d="M-26,2 C-26,26 -10,38 0,38 C10,38 26,26 26,2" fill="none" stroke="#b6863c" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="782" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#001d37">Postpartum Depression</text>
  <text x="782" y="374" text-anchor="middle" font-size="12.5" fill="#5a6b7a">Heavy. Most of the day, nearly</text>
  <text x="782" y="392" text-anchor="middle" font-size="12.5" fill="#5a6b7a">every day. Usually needs care.</text>
</svg>
