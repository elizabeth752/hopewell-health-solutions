<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="swtitle swdesc" font-family="Arial, Helvetica, sans-serif">
  <title id="swtitle">Postpartum depression feels heavier than the baby blues</title>
  <desc id="swdesc">The baby blues are a light, passing weight: mood swings, sadness, crying spells. Postpartum depression is a heavier, more constant weight: sadness or emptiness most of the day, nearly every day, that does not lift on its own.</desc>
  <rect width="1100" height="440" fill="#ffffff"/>

  <text x="550" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#001d37">Postpartum depression lasts longer and feels heavier</text>

  <!-- beam: straight line, explicit endpoints (no transform) — right side (heavier) sits lower than left -->
  <line x1="550" y1="168" x2="550" y2="235" stroke="#5a6b7a" stroke-width="4"/>
  <line x1="318" y1="148" x2="782" y2="188" stroke="#5a6b7a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="550" cy="168" r="9" fill="#001d37"/>

  <!-- left side: feather (light) — beam end (318,148) -->
  <line x1="318" y1="148" x2="318" y2="193" stroke="#5a6b7a" stroke-width="2"/>
  <g transform="translate(318,251)">
    <circle cx="0" cy="0" r="58" fill="#e7eef5"/>
    <path d="M0,-32 C14,-18 14,18 0,34 C-14,18 -14,-18 0,-32 Z" fill="none" stroke="#265489" stroke-width="2"/>
    <line x1="0" y1="-30" x2="0" y2="32" stroke="#265489" stroke-width="1.5"/>
    <path d="M0,-18 L10,-10 M0,-2 L11,6 M0,14 L9,22" stroke="#265489" stroke-width="1.3" fill="none"/>
    <path d="M0,-18 L-10,-10 M0,-2 L-11,6 M0,14 L-9,22" stroke="#265489" stroke-width="1.3" fill="none"/>
  </g>
  <text x="318" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#001d37">The Baby Blues</text>
  <text x="318" y="351" text-anchor="middle" font-size="12.5" fill="#5a6b7a">Light. Mild. Passes on its own</text>
  <text x="318" y="369" text-anchor="middle" font-size="12.5" fill="#5a6b7a">within about two weeks.</text>

  <!-- right side: anchor (heavy) — beam end (782,188), sits lower than the feather side -->
  <line x1="782" y1="188" x2="782" y2="233" stroke="#5a6b7a" stroke-width="2"/>
  <g transform="translate(782,297)">
    <circle cx="0" cy="0" r="64" fill="#f3e8d2"/>
    <circle cx="0" cy="-30" r="11" fill="none" stroke="#b6863c" stroke-width="3"/>
    <line x1="0" y1="-19" x2="0" y2="30" stroke="#b6863c" stroke-width="4"/>
    <line x1="-26" y1="2" x2="26" y2="2" stroke="#b6863c" stroke-width="4"/>
    <path d="M-26,2 C-26,26 -10,38 0,38 C10,38 26,26 26,2" fill="none" stroke="#b6863c" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="782" y="375" text-anchor="middle" font-size="15" font-weight="700" fill="#001d37">Postpartum Depression</text>
  <text x="782" y="397" text-anchor="middle" font-size="12.5" fill="#5a6b7a">Heavy. Most of the day, nearly</text>
  <text x="782" y="415" text-anchor="middle" font-size="12.5" fill="#5a6b7a">every day. Usually needs care.</text>
</svg>
