<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="380" rx="24" fill="#f5f2eb"/>

  <text x="500" y="52" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#b6863c">WESTBROOK CAMPUS ROLLOUT</text>

  <defs>
    <marker id="tArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#265489"/>
    </marker>
  </defs>

  <!-- spine -->
  <line x1="150" y1="200" x2="850" y2="200" stroke="#dcd3c0" stroke-width="3"/>
  <line x1="150" y1="200" x2="410" y2="200" stroke="#265489" stroke-width="3" marker-end="url(#tArrow)"/>
  <line x1="596" y1="200" x2="792" y2="200" stroke="#265489" stroke-width="3" stroke-dasharray="1,9" stroke-linecap="round" marker-end="url(#tArrow)"/>

  <!-- node: today -->
  <circle cx="150" cy="200" r="9" fill="#ffffff" stroke="#5a6b7a" stroke-width="3"/>
  <text x="150" y="168" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.6" fill="#5a6b7a">TODAY</text>
  <text x="150" y="242" text-anchor="middle" font-size="12" fill="#5a6b7a">Admissions is taking</text>
  <text x="150" y="258" text-anchor="middle" font-size="12" fill="#5a6b7a">calls now</text>

  <!-- node: sept 28 (primary) -->
  <circle cx="500" cy="200" r="66" fill="#1b3e63"/>
  <text x="500" y="170" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.8" fill="#f3e8d2">SEPTEMBER 28</text>
  <text x="500" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Campus</text>
  <text x="500" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Opens</text>
  <text x="500" y="244" text-anchor="middle" font-size="10.5" fill="#cddaea">3 services begin</text>

  <!-- node: october -->
  <circle cx="850" cy="200" r="52" fill="#ffffff" stroke="#b6863c" stroke-width="3"/>
  <text x="850" y="178" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.8" fill="#b6863c">OCTOBER</text>
  <text x="850" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Co-Occurring</text>
  <text x="850" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">IOP Added</text>

  <text x="500" y="300" text-anchor="middle" font-size="12.5" fill="#5a6b7a">Women&#8217;s Wellness IOP &#183; Medication Management &#183; Individual Therapy</text>
  <text x="500" y="332" text-anchor="middle" font-size="13" fill="#5a6b7a">Clients can be assessed and scheduled ahead of the start date rather than waiting until the doors open.</text>
</svg>
