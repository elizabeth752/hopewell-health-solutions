<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="628" fill="#f5f2eb"/>

  <defs>
    <marker id="igArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#265489"/>
    </marker>
  </defs>

  <!-- header -->
  <text x="600" y="40" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#b6863c">HOPEWELL HEALTH SOLUTIONS</text>
  <text x="600" y="78" text-anchor="middle" font-size="28" font-weight="700" fill="#001d37">How to Stop Scrolling Addiction</text>
  <line x1="60" y1="104" x2="1140" y2="104" stroke="#e4ddd0" stroke-width="1.5"/>

  <!-- column dividers -->
  <line x1="420" y1="128" x2="420" y2="548" stroke="#e4ddd0" stroke-width="1.5"/>
  <line x1="780" y1="128" x2="780" y2="548" stroke="#e4ddd0" stroke-width="1.5"/>

  <!-- ============ COLUMN 1: the bedtime loop ============ -->
  <text x="240" y="150" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#b6863c">THE BEDTIME LOOP</text>

  <line x1="130" y1="252" x2="166" y2="252" stroke="#265489" stroke-width="2.5" marker-end="url(#igArrow)"/>
  <line x1="226" y1="252" x2="262" y2="252" stroke="#265489" stroke-width="2.5" marker-end="url(#igArrow)"/>
  <line x1="322" y1="252" x2="358" y2="252" stroke="#265489" stroke-width="2.5" marker-end="url(#igArrow)"/>

  <circle cx="100" cy="252" r="30" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <text x="100" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#265489">1</text>
  <circle cx="196" cy="252" r="30" fill="#1b3e63"/>
  <text x="196" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <circle cx="292" cy="252" r="30" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <text x="292" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#265489">3</text>
  <circle cx="388" cy="252" r="30" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <text x="388" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#265489">4</text>

  <text x="100" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Screen</text>
  <text x="196" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Worse Sleep</text>
  <text x="292" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Weaker Control</text>
  <text x="388" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">More Scrolling</text>

  <text x="240" y="330" text-anchor="middle" font-size="11" fill="#5a6b7a">then it repeats the next night</text>

  <rect x="90" y="360" width="300" height="80" rx="12" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="240" y="392" text-anchor="middle" font-size="22" font-weight="700" fill="#b6863c">38%</text>
  <text x="240" y="412" text-anchor="middle" font-size="11.5" fill="#5a6b7a">say screens before bed hurt their</text>
  <text x="240" y="428" text-anchor="middle" font-size="11.5" fill="#5a6b7a">sleep &#8212; 46% for ages 18-24</text>

  <text x="240" y="470" text-anchor="middle" font-size="11.5" fill="#001d37">Power down 30-60 minutes before bed</text>
  <text x="240" y="488" text-anchor="middle" font-size="11.5" fill="#001d37">to break in, per the AASM.</text>

  <!-- ============ COLUMN 2: three warning signs ============ -->
  <text x="600" y="150" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#b6863c">3 WARNING SIGNS (APA)</text>

  <g transform="translate(478,206)">
    <path d="M0,-18 L16,13 L-16,13 Z" fill="none" stroke="#265489" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#265489" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="1.6" fill="#265489"/>
  </g>
  <text x="512" y="202" font-size="14" font-weight="700" fill="#001d37">Continues Despite Harm</text>
  <text x="512" y="222" font-size="11.5" fill="#5a6b7a">relationship strain, sleep loss</text>

  <g transform="translate(478,286)">
    <path d="M-18,-11 a6,6 0 0 1 6,-6 h24 a6,6 0 0 1 6,6 v13 a6,6 0 0 1 -6,6 h-19 l-8,8 v-8 h-3 a6,6 0 0 1 -6,-6 Z" fill="#e7eef5"/>
    <line x1="-19" y1="-13" x2="19" y2="17" stroke="#b6863c" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="512" y="282" font-size="14" font-weight="700" fill="#001d37">Hides How Much</text>
  <text x="512" y="302" font-size="11.5" fill="#5a6b7a">tells family or friends less than the truth</text>

  <g transform="translate(478,366)">
    <circle cx="0" cy="0" r="19" fill="none" stroke="#265489" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-11" stroke="#265489" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="5" stroke="#265489" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="512" y="362" font-size="14" font-weight="700" fill="#001d37">Preoccupied, Craving</text>
  <text x="512" y="382" font-size="11.5" fill="#5a6b7a">or losing large blocks of time to it</text>

  <line x1="440" y1="418" x2="960" y2="418" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="600" y="444" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b6863c">SMALLER, EVERYDAY TELLS</text>
  <text x="600" y="466" text-anchor="middle" font-size="11.5" fill="#001d37">Reaching for the phone before fully awake</text>
  <text x="600" y="484" text-anchor="middle" font-size="11.5" fill="#001d37">Losing a book&#8217;s thread after two paragraphs</text>

  <!-- ============ COLUMN 3: screen time and mood ============ -->
  <text x="960" y="150" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#b6863c">SCREEN TIME &amp; MOOD</text>

  <text x="960" y="228" text-anchor="middle" font-size="46" font-weight="700" fill="#b6863c">2X+</text>
  <text x="960" y="254" text-anchor="middle" font-size="12.5" fill="#001d37">more likely to report depression</text>
  <text x="960" y="272" text-anchor="middle" font-size="12.5" fill="#001d37">or anxiety symptoms</text>
  <text x="960" y="292" text-anchor="middle" font-size="11" fill="#5a6b7a">at 4+ hours of daily screen time</text>

  <line x1="850" y1="480" x2="1070" y2="480" stroke="#c9cfd6" stroke-width="1.5"/>
  <rect x="878" y="450" width="26" height="30" rx="3" fill="#e7eef5" stroke="#265489" stroke-width="1.5"/>
  <text x="891" y="443" text-anchor="middle" font-size="11" font-weight="700" fill="#265489">9.5%</text>
  <rect x="918" y="416" width="26" height="64" rx="3" fill="#b6863c"/>
  <text x="931" y="409" text-anchor="middle" font-size="12" font-weight="700" fill="#b6863c">25.9%</text>
  <text x="911" y="500" text-anchor="middle" font-size="10.5" fill="#5a6b7a">Depression</text>

  <rect x="978" y="440" width="26" height="40" rx="3" fill="#e7eef5" stroke="#265489" stroke-width="1.5"/>
  <text x="991" y="433" text-anchor="middle" font-size="11" font-weight="700" fill="#265489">12.3%</text>
  <rect x="1018" y="410" width="26" height="70" rx="3" fill="#b6863c"/>
  <text x="1031" y="403" text-anchor="middle" font-size="12" font-weight="700" fill="#b6863c">27.1%</text>
  <text x="1011" y="500" text-anchor="middle" font-size="10.5" fill="#5a6b7a">Anxiety</text>

  <text x="960" y="524" text-anchor="middle" font-size="10.5" fill="#5a6b7a">under 4 hrs/day vs. 4+ hrs/day, US teens 12-17</text>

  <!-- footer -->
  <line x1="60" y1="560" x2="1140" y2="560" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="600" y="588" text-anchor="middle" font-size="12" fill="#5a6b7a">CBT, DBT, EMDR &amp; ART &#8212; outpatient mental health care across Connecticut</text>
  <text x="600" y="610" text-anchor="middle" font-size="11" font-weight="700" fill="#265489">hopewellhealthsolutions.com</text>
</svg>
