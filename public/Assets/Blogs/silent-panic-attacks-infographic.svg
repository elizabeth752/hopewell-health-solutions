<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1840" width="1080" height="1840" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1080" height="1840" fill="#f5f2eb"/>

  <!-- ============ HEADER ============ -->
  <rect x="0" y="0" width="1080" height="210" fill="#1b3e63"/>
  <text x="540" y="88" text-anchor="middle" class="serif" font-size="42" font-weight="700" fill="#ffffff">Silent Panic Attacks</text>
  <text x="540" y="134" text-anchor="middle" class="serif" font-size="42" font-weight="700" fill="#ffffff">What They Are &amp; When to Seek Help</text>
  <text x="540" y="172" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#f3e8d2">HOPEWELL HEALTH SOLUTIONS · MENTAL HEALTH CARE</text>

  <!-- ============ SECTION A — BY THE NUMBERS ============ -->
  <text x="60" y="284" font-size="14" font-weight="700" letter-spacing="2" fill="#b6863c">BY THE NUMBERS</text>
  <text x="60" y="320" font-size="26" font-weight="700" fill="#001d37">Panic doesn't always look like panic</text>

  <!-- Card A -->
  <rect x="60" y="350" width="460" height="310" rx="20" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="88" y="390" font-size="18" font-weight="700" fill="#001d37">Any Panic Attack vs.</text>
  <text x="88" y="418" font-size="18" font-weight="700" fill="#001d37">Diagnosed Panic Disorder</text>

  <line x1="88" y1="610" x2="488" y2="610" stroke="#e4ddd0" stroke-width="1.5"/>
  <!-- bar 1: 11% -->
  <rect x="204" y="500" width="64" height="110" rx="6" fill="#2f76c4"/>
  <text x="236" y="486" text-anchor="middle" font-size="22" font-weight="700" fill="#2f76c4">11%</text>
  <text x="236" y="632" text-anchor="middle" font-size="13" fill="#5a6b7a">Any Panic Attack</text>
  <!-- bar 2: 2.7% -->
  <rect x="308" y="583" width="64" height="27" rx="6" fill="#b6863c"/>
  <text x="340" y="569" text-anchor="middle" font-size="18" font-weight="700" fill="#b6863c">2.7%</text>
  <text x="340" y="632" text-anchor="middle" font-size="13" fill="#5a6b7a">Panic Disorder</text>
  <text x="288" y="648" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b7a">Source: NIMH, accessed 2026</text>

  <!-- Card B -->
  <rect x="560" y="350" width="460" height="310" rx="20" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="588" y="390" font-size="18" font-weight="700" fill="#001d37">Panic Disorder Prevalence</text>
  <text x="588" y="418" font-size="18" font-weight="700" fill="#001d37">By Gender</text>

  <line x1="588" y1="610" x2="988" y2="610" stroke="#e4ddd0" stroke-width="1.5"/>
  <!-- bar 1: Women 3.8% -->
  <rect x="704" y="496" width="64" height="114" rx="6" fill="#b6863c"/>
  <text x="736" y="482" text-anchor="middle" font-size="22" font-weight="700" fill="#b6863c">3.8%</text>
  <text x="736" y="632" text-anchor="middle" font-size="13" fill="#5a6b7a">Women</text>
  <!-- bar 2: Men 1.6% -->
  <rect x="808" y="562" width="64" height="48" rx="6" fill="#2f76c4"/>
  <text x="840" y="548" text-anchor="middle" font-size="18" font-weight="700" fill="#2f76c4">1.6%</text>
  <text x="840" y="632" text-anchor="middle" font-size="13" fill="#5a6b7a">Men</text>
  <text x="788" y="648" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b7a">Source: NIMH, accessed 2026</text>

  <!-- ============ SECTION B — WHAT IT FEELS LIKE INSIDE ============ -->
  <text x="60" y="728" font-size="14" font-weight="700" letter-spacing="2" fill="#b6863c">WHAT IT FEELS LIKE INSIDE</text>
  <text x="60" y="764" font-size="26" font-weight="700" fill="#001d37">Symptoms hidden behind a calm face</text>

  <!-- Row 1 -->
  <g>
    <rect x="60" y="800" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="118" cy="850" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <path transform="translate(118,850)" d="M-16,2 L-8,2 L-4,-10 L0,10 L4,-13 L8,3 L16,3" fill="none" stroke="#1b3e63" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="838" font-size="17" font-weight="700" fill="#001d37">Racing Heart</text>
    <text x="160" y="862" font-size="13" fill="#5a6b7a">Pounding or irregular heartbeat</text>
  </g>
  <g>
    <rect x="560" y="800" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="618" cy="850" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <g transform="translate(618,850)" stroke="#1b3e63" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-16,0 L-5,0 M-5,0 L-10,-5 M-5,0 L-10,5"/>
      <path d="M16,0 L5,0 M5,0 L10,-5 M5,0 L10,5"/>
    </g>
    <text x="660" y="838" font-size="17" font-weight="700" fill="#001d37">Chest Tightness</text>
    <text x="660" y="862" font-size="13" fill="#5a6b7a">Pressure that isn't visible</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="60" y="920" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="118" cy="970" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <g transform="translate(118,970)" stroke="#1b3e63" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-14,-5 Q-7,-11 0,-5 Q7,1 14,-5"/>
      <path d="M-14,6 Q-7,0 0,6 Q7,12 14,6"/>
    </g>
    <text x="160" y="958" font-size="17" font-weight="700" fill="#001d37">Shortness of Breath</text>
    <text x="160" y="982" font-size="13" fill="#5a6b7a">Feels severe, looks normal</text>
  </g>
  <g>
    <rect x="560" y="920" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="618" cy="970" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <path transform="translate(618,970)" d="M11,-11 A14,14 0 1,1 -11,-11 M-11,-11 L-16,-13 M-11,-11 L-13,-6" fill="none" stroke="#1b3e63" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="660" y="958" font-size="17" font-weight="700" fill="#001d37">Dizziness</text>
    <text x="660" y="982" font-size="13" fill="#5a6b7a">Lightheaded, off-balance</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="60" y="1040" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="118" cy="1090" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <circle cx="118" cy="1090" r="14" fill="none" stroke="#1b3e63" stroke-width="2.5" stroke-dasharray="4,3"/>
    <circle cx="118" cy="1090" r="4" fill="#1b3e63"/>
    <text x="160" y="1078" font-size="17" font-weight="700" fill="#001d37">Depersonalization</text>
    <text x="160" y="1102" font-size="13" fill="#5a6b7a">Watching yourself from outside</text>
  </g>
  <g>
    <rect x="560" y="1040" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="618" cy="1090" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <text x="618" y="1090" dy="0.35em" text-anchor="middle" font-size="28" font-weight="700" fill="#1b3e63">!</text>
    <text x="660" y="1078" font-size="17" font-weight="700" fill="#001d37">Overwhelming Dread</text>
    <text x="660" y="1102" font-size="13" fill="#5a6b7a">A fear of losing control</text>
  </g>

  <!-- ============ SECTION C — THE HIDDEN TIMELINE ============ -->
  <text x="60" y="1208" font-size="14" font-weight="700" letter-spacing="2" fill="#b6863c">THE HIDDEN TIMELINE</text>
  <text x="60" y="1244" font-size="26" font-weight="700" fill="#001d37">Minutes to peak, hours to recover</text>

  <text x="60" y="1430" font-size="150" font-weight="700" fill="#2f76c4">10</text>
  <text x="200" y="1450" text-anchor="middle" font-size="15" fill="#5a6b7a">minutes for a panic</text>
  <text x="200" y="1470" text-anchor="middle" font-size="15" fill="#5a6b7a">attack to peak</text>

  <text x="380" y="1300" font-size="16" fill="#001d37">A 2025 review of digital CBT programs found</text>
  <text x="380" y="1324" font-size="16" fill="#001d37">that interoceptive exposure — training the body</text>
  <text x="380" y="1348" font-size="16" fill="#001d37">to tolerate panic sensations — consistently</text>
  <text x="380" y="1372" font-size="16" fill="#001d37">strengthened treatment outcomes for panic</text>
  <text x="380" y="1396" font-size="16" fill="#001d37">disorder and agoraphobia.</text>
  <text x="380" y="1430" font-size="12" font-style="italic" fill="#5a6b7a">Source: Jung et al., Journal of Clinical Medicine, 2025</text>

  <!-- ============ BOTTOM CTA BAND ============ -->
  <rect x="0" y="1520" width="1080" height="320" fill="#1b3e63"/>
  <text x="540" y="1575" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#ffffff">Hopewell's Care for Panic &amp; Anxiety</text>
  <text x="540" y="1610" text-anchor="middle" font-size="15" fill="#e7eef5">CBT with interoceptive exposure, therapy, and medication management — one team</text>

  <!-- badges -->
  <rect x="111" y="1640" width="266" height="44" rx="22" fill="#265489" stroke="#2f76c4" stroke-width="1.5"/>
  <text x="244" y="1668" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">CBT · EXPOSURE THERAPY</text>

  <rect x="407" y="1640" width="266" height="44" rx="22" fill="#265489" stroke="#2f76c4" stroke-width="1.5"/>
  <text x="540" y="1668" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">IOP &amp; PHP AVAILABLE</text>

  <rect x="703" y="1640" width="266" height="44" rx="22" fill="#265489" stroke="#2f76c4" stroke-width="1.5"/>
  <text x="836" y="1668" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4 CONNECTICUT LOCATIONS</text>

  <!-- CTA button -->
  <rect x="370" y="1700" width="340" height="50" rx="25" fill="#2f76c4"/>
  <text x="540" y="1734" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Call (860) 735-1448</text>

  <text x="540" y="1775" text-anchor="middle" font-size="14" fill="#e7eef5">hopewellhealthsolutions.com</text>
  <text x="540" y="1800" text-anchor="middle" font-size="11" fill="#9fb6ce">Sources: National Institute of Mental Health · Cackovic et al. 2026 · Jung et al. 2025</text>
</svg>
