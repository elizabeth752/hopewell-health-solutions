<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="440" rx="24" fill="#f5f2eb"/>

  <defs>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#265489"/>
    </marker>
    <marker id="loopArrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b6863c"/>
    </marker>
  </defs>

  <text x="500" y="42" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#b6863c">WHY BEDTIME IS WHERE THE HABIT DOES THE MOST DAMAGE</text>

  <!-- forward arrows along the row -->
  <line x1="212" y1="230" x2="298" y2="230" stroke="#265489" stroke-width="3" marker-end="url(#loopArrow)"/>
  <line x1="462" y1="230" x2="548" y2="230" stroke="#265489" stroke-width="3" marker-end="url(#loopArrow)"/>
  <line x1="712" y1="230" x2="798" y2="230" stroke="#265489" stroke-width="3" marker-end="url(#loopArrow)"/>

  <!-- return arrow, arcing over the top: closes the loop -->
  <path d="M880,155 C 880,60 120,60 120,155" fill="none" stroke="#b6863c" stroke-width="3" stroke-dasharray="1,10" stroke-linecap="round" marker-end="url(#loopArrowGold)"/>
  <rect x="345" y="75" width="310" height="22" fill="#f5f2eb"/>
  <text x="500" y="91" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#b6863c">THE LOOP REPEATS THE NEXT NIGHT</text>

  <!-- node 1 -->
  <circle cx="150" cy="230" r="80" fill="#ffffff" stroke="#265489" stroke-width="2.5"/>
  <text x="150" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Screen</text>
  <text x="150" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Before Bed</text>
  <text x="150" y="260" text-anchor="middle" font-size="11" fill="#5a6b7a">used every night</text>
  <text x="150" y="276" text-anchor="middle" font-size="11" fill="#5a6b7a">by half of adults</text>

  <!-- node 2 -->
  <circle cx="380" cy="230" r="80" fill="#1b3e63"/>
  <text x="380" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Worse</text>
  <text x="380" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Sleep</text>
  <text x="380" y="253" text-anchor="middle" font-size="20" font-weight="700" fill="#f3e8d2">38%</text>
  <text x="380" y="269" text-anchor="middle" font-size="10" fill="#e7eef5">46% if age 18-24</text>

  <!-- node 3 -->
  <circle cx="630" cy="230" r="80" fill="#ffffff" stroke="#265489" stroke-width="2.5"/>
  <text x="630" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Weaker</text>
  <text x="630" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Self-Control</text>
  <text x="630" y="260" text-anchor="middle" font-size="11" fill="#5a6b7a">less able to resist</text>
  <text x="630" y="276" text-anchor="middle" font-size="11" fill="#5a6b7a">the next urge to check</text>

  <!-- node 4 -->
  <circle cx="880" cy="230" r="80" fill="#ffffff" stroke="#265489" stroke-width="2.5"/>
  <text x="880" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">More</text>
  <text x="880" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Scrolling</text>
  <text x="880" y="260" text-anchor="middle" font-size="11" fill="#5a6b7a">a quarter already put</text>
  <text x="880" y="276" text-anchor="middle" font-size="11" fill="#5a6b7a">screens over sleep</text>

  <text x="500" y="400" text-anchor="middle" font-size="13" fill="#5a6b7a">Powering down 30-60 minutes before bed is where the American Academy of Sleep Medicine says to break in.</text>
</svg>
