<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1840" width="1080" height="1840" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1080" height="1840" fill="#f5f2eb"/>

  <!-- ============ HEADER ============ -->
  <rect x="0" y="0" width="1080" height="210" fill="#1b3e63"/>
  <text x="540" y="88" text-anchor="middle" class="serif" font-size="42" font-weight="700" fill="#ffffff">Recovering From Narcissistic Abuse</text>
  <text x="540" y="134" text-anchor="middle" class="serif" font-size="42" font-weight="700" fill="#ffffff">When Therapy Alone Isn't Enough</text>
  <text x="540" y="172" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="2" fill="#f3e8d2">HOPEWELL HEALTH SOLUTIONS · WOMEN'S TRAUMA CARE</text>

  <!-- ============ SECTION A — BY THE NUMBERS ============ -->
  <text x="60" y="284" font-size="14" font-weight="700" letter-spacing="2" fill="#b6863c">BY THE NUMBERS</text>
  <text x="60" y="320" font-size="26" font-weight="700" fill="#001d37">Narcissistic abuse leaves a measurable mark</text>

  <!-- Card A -->
  <rect x="60" y="350" width="460" height="310" rx="20" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="88" y="390" font-size="18" font-weight="700" fill="#001d37">PTSD Prevalence After</text>
  <text x="88" y="418" font-size="18" font-weight="700" fill="#001d37">Intimate Partner Violence</text>

  <!-- baseline -->
  <line x1="88" y1="610" x2="488" y2="610" stroke="#e4ddd0" stroke-width="1.5"/>
  <!-- bar 1: 52.3% -->
  <rect x="204" y="479.25" width="64" height="130.75" rx="6" fill="#2f76c4"/>
  <text x="236" y="465" text-anchor="middle" font-size="22" font-weight="700" fill="#2f76c4">52.3%</text>
  <text x="236" y="632" text-anchor="middle" font-size="13" fill="#5a6b7a">Survived IPV</text>
  <!-- bar 2: 1.7% -->
  <rect x="308" y="605.75" width="64" height="4.25" rx="2" fill="#9aa9b6"/>
  <text x="340" y="591.75" text-anchor="middle" font-size="16" font-weight="700" fill="#5a6b7a">1.7%</text>
  <text x="340" y="632" text-anchor="middle" font-size="13" fill="#5a6b7a">No IPV history</text>
  <text x="288" y="648" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b7a">Source: Astridge et al., 2026</text>

  <!-- Card B -->
  <rect x="560" y="350" width="460" height="310" rx="20" fill="#ffffff" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="588" y="390" font-size="18" font-weight="700" fill="#001d37">C-PTSD Outpaces PTSD</text>
  <text x="588" y="418" font-size="18" font-weight="700" fill="#001d37">Among IPV Survivors</text>

  <line x1="588" y1="610" x2="988" y2="610" stroke="#e4ddd0" stroke-width="1.5"/>
  <!-- bar 1: C-PTSD 31.2% -->
  <rect x="704" y="493" width="64" height="117" rx="6" fill="#b6863c"/>
  <text x="736" y="479" text-anchor="middle" font-size="22" font-weight="700" fill="#b6863c">31.2%</text>
  <text x="736" y="632" text-anchor="middle" font-size="13" fill="#5a6b7a">C-PTSD</text>
  <!-- bar 2: PTSD 17.1% -->
  <rect x="808" y="545.875" width="64" height="64.125" rx="6" fill="#2f76c4"/>
  <text x="840" y="531.875" text-anchor="middle" font-size="18" font-weight="700" fill="#2f76c4">17.1%</text>
  <text x="840" y="632" text-anchor="middle" font-size="13" fill="#5a6b7a">PTSD</text>
  <text x="788" y="648" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b7a">Source: Hu et al., 2026</text>

  <!-- ============ SECTION B — SYMPTOM CLUSTER ============ -->
  <text x="60" y="728" font-size="14" font-weight="700" letter-spacing="2" fill="#b6863c">THE SYMPTOM CLUSTER</text>
  <text x="60" y="764" font-size="26" font-weight="700" fill="#001d37">What lingers after the relationship ends</text>

  <!-- Row 1 -->
  <g>
    <rect x="60" y="800" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="118" cy="850" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <text x="118" y="850" dy="0.35em" text-anchor="middle" font-size="28" font-weight="700" fill="#1b3e63">?</text>
    <text x="160" y="838" font-size="17" font-weight="700" fill="#001d37">Chronic Self-Doubt</text>
    <text x="160" y="862" font-size="13" fill="#5a6b7a">Second-guessing your own memory</text>
  </g>
  <g>
    <rect x="560" y="800" width="460" height="100" rx="16" fill="#e7eef5"/>
    <g transform="translate(618,850)">
      <ellipse rx="15" ry="8" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
      <circle r="3.5" fill="#1b3e63"/>
    </g>
    <circle cx="618" cy="850" r="26" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
    <text x="660" y="838" font-size="17" font-weight="700" fill="#001d37">Hypervigilance</text>
    <text x="660" y="862" font-size="13" fill="#5a6b7a">Startling easily, scanning for anger</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="60" y="920" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="118" cy="970" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <path transform="translate(118,970)" d="M0,-15 L13,-9 V4 C13,13 0,17 0,17 C0,17 -13,13 -13,4 V-9 Z" fill="none" stroke="#1b3e63" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="160" y="958" font-size="17" font-weight="700" fill="#001d37">Persistent Shame</text>
    <text x="160" y="982" font-size="13" fill="#5a6b7a">Doesn't respond to reassurance</text>
  </g>
  <g>
    <rect x="560" y="920" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="618" cy="970" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <rect transform="translate(618,970)" x="-15" y="-12" width="30" height="20" rx="6" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
    <path transform="translate(618,970)" d="M-6,8 L-10,16 L0,8 Z" fill="none" stroke="#1b3e63" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="660" y="958" font-size="17" font-weight="700" fill="#001d37">Silenced Needs</text>
    <text x="660" y="982" font-size="13" fill="#5a6b7a">Trouble asking without apologizing</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="60" y="1040" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="118" cy="1090" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <path transform="translate(118,1090)" d="M-16,2 L-8,2 L-4,-9 L0,10 L4,-13 L8,3 L16,3" fill="none" stroke="#1b3e63" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="1078" font-size="17" font-weight="700" fill="#001d37">Numbness ↔ Reactivity</text>
    <text x="160" y="1102" font-size="13" fill="#5a6b7a">Flat, then suddenly overwhelmed</text>
  </g>
  <g>
    <rect x="560" y="1040" width="460" height="100" rx="16" fill="#e7eef5"/>
    <circle cx="618" cy="1090" r="26" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <g transform="translate(618,1090)">
      <circle cx="-7" cy="0" r="12" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
      <circle cx="7" cy="0" r="12" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
    </g>
    <text x="660" y="1078" font-size="17" font-weight="700" fill="#001d37">Trust Difficulty</text>
    <text x="660" y="1102" font-size="13" fill="#5a6b7a">Even with new partners or clinicians</text>
  </g>

  <!-- ============ SECTION C — THE THERAPY GAP ============ -->
  <text x="60" y="1208" font-size="14" font-weight="700" letter-spacing="2" fill="#b6863c">THE THERAPY GAP</text>
  <text x="60" y="1244" font-size="26" font-weight="700" fill="#001d37">Six days for avoidance to rebuild</text>

  <text x="60" y="1430" font-size="150" font-weight="700" fill="#2f76c4">6</text>
  <text x="200" y="1450" text-anchor="middle" font-size="15" fill="#5a6b7a">of 7 days each week</text>
  <text x="200" y="1470" text-anchor="middle" font-size="15" fill="#5a6b7a">without clinical support</text>

  <text x="380" y="1300" font-size="16" fill="#001d37">A 2025 clinical trial compared eight days of</text>
  <text x="380" y="1324" font-size="16" fill="#001d37">intensive treatment against typical weekly</text>
  <text x="380" y="1348" font-size="16" fill="#001d37">sessions for PTSD and C-PTSD. Both produced</text>
  <text x="380" y="1372" font-size="16" fill="#001d37">large, lasting symptom reduction — but dropout</text>
  <text x="380" y="1396" font-size="16" fill="#001d37">was significantly lower in the intensive format.</text>
  <text x="380" y="1430" font-size="12" font-style="italic" fill="#5a6b7a">Source: Gahnfelt et al., European Journal of Psychotraumatology, 2025</text>

  <!-- ============ BOTTOM CTA BAND ============ -->
  <rect x="0" y="1520" width="1080" height="320" fill="#1b3e63"/>
  <text x="540" y="1575" text-anchor="middle" class="serif" font-size="28" font-weight="700" fill="#ffffff">Hopewell's Women's Trauma IOP</text>
  <text x="540" y="1610" text-anchor="middle" font-size="15" fill="#e7eef5">Trauma-focused counseling, EMDR, DBT, and group therapy — one team</text>

  <!-- badges -->
  <rect x="111" y="1640" width="266" height="44" rx="22" fill="#265489" stroke="#2f76c4" stroke-width="1.5"/>
  <text x="244" y="1668" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MON–THU · 5–8 PM</text>

  <rect x="407" y="1640" width="266" height="44" rx="22" fill="#265489" stroke="#2f76c4" stroke-width="1.5"/>
  <text x="540" y="1668" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">~8 WEEKS, EXTENDABLE</text>

  <rect x="703" y="1640" width="266" height="44" rx="22" fill="#265489" stroke="#2f76c4" stroke-width="1.5"/>
  <text x="836" y="1668" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">EMDR • DBT • GROUP</text>

  <!-- CTA button -->
  <rect x="370" y="1700" width="340" height="50" rx="25" fill="#2f76c4"/>
  <text x="540" y="1734" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Call (860) 735-1448</text>

  <text x="540" y="1775" text-anchor="middle" font-size="14" fill="#e7eef5">hopewellhealthsolutions.com</text>
  <text x="540" y="1800" text-anchor="middle" font-size="11" fill="#9fb6ce">Sources: Astridge et al. 2026 · Kassing &amp; Collins 2026 · Lohmann et al. 2024 · Hu et al. 2026 · Gahnfelt et al. 2025</text>
</svg>
