<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="400" rx="24" fill="#f5f2eb"/>

  <text x="500" y="42" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#b6863c">US TEENS, DAILY NON-SCHOOLWORK SCREEN TIME</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#5a6b7a">50.4% already log 4 or more hours a day</text>

  <!-- legend -->
  <rect x="330" y="84" width="16" height="16" rx="3" fill="#e7eef5" stroke="#265489" stroke-width="1.5"/>
  <text x="352" y="97" font-size="12" fill="#001d37">Under 4 hrs/day</text>
  <rect x="500" y="84" width="16" height="16" rx="3" fill="#b6863c"/>
  <text x="522" y="97" font-size="12" fill="#001d37">4+ hrs/day</text>

  <!-- baseline -->
  <line x1="120" y1="330" x2="880" y2="330" stroke="#c9cfd6" stroke-width="1.5"/>

  <!-- Depression cluster -->
  <rect x="290" y="257" width="52" height="73" rx="4" fill="#e7eef5" stroke="#265489" stroke-width="1.5"/>
  <text x="316" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#265489">9.5%</text>
  <rect x="352" y="131" width="52" height="199" rx="4" fill="#b6863c"/>
  <text x="378" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#b6863c">25.9%</text>
  <text x="347" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Depression symptoms</text>

  <!-- Anxiety cluster -->
  <rect x="596" y="236" width="52" height="94" rx="4" fill="#e7eef5" stroke="#265489" stroke-width="1.5"/>
  <text x="622" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#265489">12.3%</text>
  <rect x="658" y="123" width="52" height="207" rx="4" fill="#b6863c"/>
  <text x="684" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#b6863c">27.1%</text>
  <text x="653" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Anxiety symptoms</text>

  <text x="500" y="386" text-anchor="middle" font-size="12" fill="#5a6b7a">Teens with 4+ daily hours were more than twice as likely to report each</text>
</svg>
