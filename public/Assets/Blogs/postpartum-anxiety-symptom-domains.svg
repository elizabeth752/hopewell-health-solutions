<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="sdtitle sddesc" font-family="Arial, Helvetica, sans-serif">
  <title id="sdtitle">Postpartum anxiety shows up in three places</title>
  <desc id="sddesc">Postpartum anxiety symptoms grouped into three domains: thoughts, body, and behavior, with common examples in each.</desc>
  <rect width="1100" height="480" fill="#ffffff"/>

  <text x="50" y="52" font-size="20" font-weight="700" fill="#001d37">Postpartum anxiety shows up in three places</text>
  <text x="50" y="78" font-size="14" fill="#5a6b7a">Thoughts, body, and behavior all change</text>

  <!-- ============ CARD 1: THOUGHTS ============ -->
  <rect x="50" y="110" width="320" height="330" rx="10" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(210,166)">
    <path d="M-30,6 C-34,-16 -16,-30 2,-28 C18,-34 36,-22 32,-4 C40,-2 40,14 28,16 C28,24 16,28 8,22 C0,30 -14,28 -18,18 C-30,20 -36,10 -30,6 Z" fill="none" stroke="#265489" stroke-width="2.2"/>
    <circle cx="-34" cy="30" r="4" fill="#265489"/>
    <circle cx="-24" cy="42" r="2.5" fill="#265489"/>
  </g>
  <text x="210" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#265489">Thoughts</text>
  <line x1="80" y1="246" x2="340" y2="246" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="210" y="280" text-anchor="middle" font-size="14" fill="#001d37">Constant worry about</text>
  <text x="210" y="300" text-anchor="middle" font-size="14" fill="#001d37">the baby's safety</text>
  <text x="210" y="332" text-anchor="middle" font-size="14" fill="#001d37">A sense something</text>
  <text x="210" y="352" text-anchor="middle" font-size="14" fill="#001d37">bad is coming</text>
  <text x="210" y="384" text-anchor="middle" font-size="14" fill="#001d37">Racing thoughts,</text>
  <text x="210" y="404" text-anchor="middle" font-size="14" fill="#001d37">trouble focusing</text>

  <!-- ============ CARD 2: BODY ============ -->
  <rect x="390" y="110" width="320" height="330" rx="10" fill="#ffffff" stroke="#b6863c" stroke-width="2"/>
  <g transform="translate(550,166)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#b6863c" stroke-width="2.2"/>
    <path d="M-18,2 L-9,2 L-4,-12 L4,16 L9,2 L18,2" fill="none" stroke="#b6863c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="550" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#b6863c">Body</text>
  <line x1="420" y1="246" x2="680" y2="246" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="550" y="280" text-anchor="middle" font-size="14" fill="#001d37">Racing heart,</text>
  <text x="550" y="300" text-anchor="middle" font-size="14" fill="#001d37">shortness of breath</text>
  <text x="550" y="332" text-anchor="middle" font-size="14" fill="#001d37">Nausea, dizziness,</text>
  <text x="550" y="352" text-anchor="middle" font-size="14" fill="#001d37">hot flashes</text>
  <text x="550" y="384" text-anchor="middle" font-size="14" fill="#001d37">Disrupted sleep</text>
  <text x="550" y="404" text-anchor="middle" font-size="14" fill="#001d37">or appetite</text>

  <!-- ============ CARD 3: BEHAVIOR ============ -->
  <rect x="730" y="110" width="320" height="330" rx="10" fill="#ffffff" stroke="#5c7c6b" stroke-width="2"/>
  <g transform="translate(890,166)">
    <circle cx="-4" cy="-4" r="18" fill="none" stroke="#5c7c6b" stroke-width="2.4"/>
    <line x1="9" y1="9" x2="24" y2="24" stroke="#5c7c6b" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="890" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#5c7c6b">Behavior</text>
  <line x1="760" y1="246" x2="1020" y2="246" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="890" y="280" text-anchor="middle" font-size="14" fill="#001d37">Checking on the baby</text>
  <text x="890" y="300" text-anchor="middle" font-size="14" fill="#001d37">again and again</text>
  <text x="890" y="332" text-anchor="middle" font-size="14" fill="#001d37">Feeling on edge or</text>
  <text x="890" y="352" text-anchor="middle" font-size="14" fill="#001d37">unable to sit still</text>
  <text x="890" y="384" text-anchor="middle" font-size="14" fill="#001d37">Avoiding places</text>
  <text x="890" y="404" text-anchor="middle" font-size="14" fill="#001d37">or activities</text>
</svg>
