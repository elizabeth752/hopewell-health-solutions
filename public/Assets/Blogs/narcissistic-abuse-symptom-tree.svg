<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="680" rx="24" fill="#f5f2eb"/>

  <!-- root -->
  <rect x="350" y="40" width="300" height="60" rx="30" fill="#1b3e63"/>
  <text x="500" y="77" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">AFTER THE RELATIONSHIP ENDS</text>

  <!-- trunk -->
  <line x1="500" y1="100" x2="500" y2="140" stroke="#c9cfd6" stroke-width="2"/>
  <line x1="167" y1="140" x2="833" y2="140" stroke="#c9cfd6" stroke-width="2"/>
  <!-- drops to each leaf column -->
  <g stroke="#c9cfd6" stroke-width="2">
    <line x1="167" y1="140" x2="167" y2="185"/>
    <line x1="333" y1="140" x2="333" y2="185"/>
    <line x1="500" y1="140" x2="500" y2="185"/>
    <line x1="667" y1="140" x2="667" y2="185"/>
    <line x1="833" y1="140" x2="833" y2="185"/>
  </g>
  <!-- 6th leaf, offset row below since 6 doesn't split evenly across 5 columns -->

  <!-- Leaf 1: Chronic Self-Doubt -->
  <g>
    <circle cx="167" cy="235" r="48" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <text x="167" y="235" dy="0.35em" text-anchor="middle" font-size="26" font-weight="700" fill="#1b3e63">?</text>
    <text x="167" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#001d37">Self-Doubt</text>
  </g>

  <!-- Leaf 2: Hypervigilance -->
  <g>
    <circle cx="333" cy="235" r="48" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <g transform="translate(333,235)">
      <ellipse rx="14" ry="7.5" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
      <circle r="3.2" fill="#1b3e63"/>
    </g>
    <circle cx="333" cy="235" r="24" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
    <text x="333" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#001d37">Hypervigilance</text>
  </g>

  <!-- Leaf 3: Persistent Shame -->
  <g>
    <circle cx="500" cy="235" r="48" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <path transform="translate(500,235)" d="M0,-14 L12,-8 V4 C12,12 0,16 0,16 C0,16 -12,12 -12,4 V-8 Z" fill="none" stroke="#1b3e63" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="500" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#001d37">Shame</text>
  </g>

  <!-- Leaf 4: Silenced Needs -->
  <g>
    <circle cx="667" cy="235" r="48" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <rect transform="translate(667,235)" x="-14" y="-11" width="28" height="18" rx="5" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
    <path transform="translate(667,235)" d="M-5,7 L-9,15 L1,7 Z" fill="none" stroke="#1b3e63" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="667" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#001d37">Silenced Needs</text>
  </g>

  <!-- Leaf 5: Numbness <-> Reactivity -->
  <g>
    <circle cx="833" cy="235" r="48" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <path transform="translate(833,235)" d="M-15,2 L-7,2 L-3,-9 L0,9 L3,-12 L7,3 L15,3" fill="none" stroke="#1b3e63" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="833" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Numbness ↔ Reactivity</text>
  </g>

  <!-- Leaf 6: Trust Difficulty, routed clear of the row-1 leaves via x=580 -->
  <path d="M580,140 L580,430 L548,430" fill="none" stroke="#c9cfd6" stroke-width="2" stroke-dasharray="1,7"/>
  <g>
    <circle cx="500" cy="430" r="48" fill="#ffffff" stroke="#1b3e63" stroke-width="2.5"/>
    <g transform="translate(500,430)">
      <circle cx="-8" cy="0" r="13" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
      <circle cx="8" cy="0" r="13" fill="none" stroke="#1b3e63" stroke-width="2.5"/>
    </g>
    <text x="500" y="499" text-anchor="middle" font-size="14" font-weight="700" fill="#001d37">Trust Difficulty</text>
  </g>

  <text x="500" y="600" text-anchor="middle" font-size="14" fill="#001d37" font-style="italic">Arrives as a cluster, rarely one symptom alone.</text>
</svg>
