<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b6863c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="400" rx="24" fill="#f5f2eb"/>

  <text x="500" y="42" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#b6863c">WHERE TREATMENT STARTS, AND WHERE IT CAN GO</text>

  <!-- baseline -->
  <line x1="70" y1="330" x2="650" y2="330" stroke="#c9cfd6" stroke-width="1.5"/>

  <!-- Step 1: Weekly Counseling -->
  <rect x="90" y="264" width="150" height="66" rx="8" fill="#e7eef5" stroke="#265489" stroke-width="1.5"/>
  <text x="165" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#265489">Weekly Counseling</text>

  <!-- Step 2: IOP -->
  <rect x="270" y="204" width="150" height="126" rx="8" fill="#e7eef5" stroke="#265489" stroke-width="1.5"/>
  <text x="345" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#265489">IOP</text>

  <!-- Step 3: PHP -->
  <rect x="450" y="144" width="150" height="186" rx="8" fill="#1b3e63"/>
  <text x="525" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1b3e63">PHP</text>

  <!-- connecting arrow up to TMS card -->
  <path d="M600,144 C 660,144 660,90 700,90" fill="none" stroke="#b6863c" stroke-width="3" stroke-dasharray="1,8" stroke-linecap="round" marker-end="url(#arrowGold)"/>

  <!-- TMS card, off to the side, not literally "the top step" -->
  <rect x="700" y="60" width="230" height="150" rx="16" fill="#f3e8d2" stroke="#b6863c" stroke-width="2"/>
  <text x="815" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5f22">TMS</text>
  <text x="815" y="112" text-anchor="middle" font-size="11" fill="#5a6b7a">When medication and</text>
  <text x="815" y="128" text-anchor="middle" font-size="11" fill="#5a6b7a">therapy have not been</text>
  <text x="815" y="144" text-anchor="middle" font-size="11" fill="#5a6b7a">enough on their own</text>
  <text x="815" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5f22">Even severe anhedonia</text>
  <text x="815" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5f22">responds as well as any case</text>

  <text x="165" y="352" text-anchor="middle" font-size="12" fill="#5a6b7a">Suits many people</text>
  <text x="345" y="352" text-anchor="middle" font-size="12" fill="#5a6b7a">Structured, several days a week</text>
  <text x="525" y="352" text-anchor="middle" font-size="12" fill="#5a6b7a">Full-day treatment</text>

  <text x="500" y="386" text-anchor="middle" font-size="12" fill="#5a6b7a">More intensive care to the right &#8212; TMS is a different kind of next step, not simply "more of the same."</text>
</svg>
