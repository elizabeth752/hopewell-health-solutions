<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="400" rx="24" fill="#f5f2eb"/>

  <text x="500" y="42" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#b6863c">FREQUENCY AND PROBLEMS ARE NOT THE SAME MEASURE</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#5a6b7a">Correlation strength with anxiety and depression, general use vs. problematic use</text>

  <!-- legend -->
  <rect x="330" y="84" width="16" height="16" rx="3" fill="#e7eef5" stroke="#265489" stroke-width="1.5"/>
  <text x="352" y="97" font-size="12" fill="#001d37">General use</text>
  <rect x="500" y="84" width="16" height="16" rx="3" fill="#b6863c"/>
  <text x="522" y="97" font-size="12" fill="#001d37">Problematic use</text>

  <!-- baseline -->
  <line x1="120" y1="330" x2="880" y2="330" stroke="#c9cfd6" stroke-width="1.5"/>

  <!-- Anxiety cluster -->
  <rect x="290" y="322" width="52" height="8" rx="4" fill="#e7eef5" stroke="#265489" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="316" y="313" text-anchor="middle" font-size="12.5" font-weight="700" fill="#265489">not significant</text>
  <rect x="352" y="228" width="52" height="102" rx="4" fill="#b6863c"/>
  <text x="378" y="219" text-anchor="middle" font-size="16" font-weight="700" fill="#b6863c">0.19</text>
  <text x="347" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Anxiety</text>

  <!-- Depression cluster -->
  <rect x="596" y="322" width="52" height="8" rx="4" fill="#e7eef5" stroke="#265489" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="622" y="313" text-anchor="middle" font-size="12.5" font-weight="700" fill="#265489">not significant</text>
  <rect x="658" y="188" width="52" height="142" rx="4" fill="#b6863c"/>
  <text x="684" y="179" text-anchor="middle" font-size="16" font-weight="700" fill="#b6863c">0.26</text>
  <text x="653" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#001d37">Depression</text>

  <text x="500" y="386" text-anchor="middle" font-size="12" fill="#5a6b7a">Impaired control tracks with distress. Hours logged, on their own, do not.</text>
</svg>
