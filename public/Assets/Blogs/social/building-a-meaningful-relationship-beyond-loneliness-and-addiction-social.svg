<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>.serif { font-family: Georgia, 'Times New Roman', serif; }</style>
  </defs>

  <rect x="0" y="0" width="1200" height="628" fill="#f5f2eb"/>

  <!-- ============ LEFT PANEL ============ -->
  <rect x="0" y="0" width="460" height="628" fill="#1b3e63"/>
  <text x="230" y="54" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.8" fill="#f3e8d2">HOPEWELL HEALTH SOLUTIONS</text>

  <text x="230" y="140" text-anchor="middle" class="serif" font-size="27" font-weight="700" fill="#ffffff">Building a Meaningful</text>
  <text x="230" y="176" text-anchor="middle" class="serif" font-size="27" font-weight="700" fill="#ffffff">Relationship Beyond</text>
  <text x="230" y="212" text-anchor="middle" class="serif" font-size="27" font-weight="700" fill="#ffffff">Loneliness &amp; Addiction</text>

  <line x1="190" y1="240" x2="270" y2="240" stroke="#b6863c" stroke-width="2"/>
  <text x="230" y="266" text-anchor="middle" font-size="13" letter-spacing="0.5" fill="#e7eef5">Mental Health Care</text>

  <text x="230" y="562" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">(860) 735-1448</text>
  <text x="230" y="594" text-anchor="middle" font-size="13" fill="#9fb6ce">hopewellhealthsolutions.com</text>

  <!-- ============ RIGHT: HERO STAT ============ -->
  <text x="500" y="76" font-size="13" font-weight="700" letter-spacing="1.8" fill="#b6863c">BY THE NUMBERS</text>

  <text x="830" y="228" text-anchor="middle" font-size="110" font-weight="700" fill="#b6863c">1 in 3</text>
  <text x="830" y="266" text-anchor="middle" font-size="18" fill="#001d37">U.S. adults reports feeling lonely</text>
  <text x="830" y="294" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6b7a">Source: CDC, 2024</text>

  <!-- ============ RIGHT: SIX QUALITIES ICON STRIP ============ -->
  <line x1="500" y1="330" x2="1160" y2="330" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="500" y="356" font-size="12" font-weight="700" letter-spacing="1.2" fill="#b6863c">SIX QUALITIES OF A MEANINGFUL RELATIONSHIP</text>

  <!-- Trust -->
  <circle cx="555" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(555,420)">
    <circle cx="-6" cy="0" r="9" fill="none" stroke="#265489" stroke-width="2"/>
    <circle cx="6" cy="0" r="9" fill="none" stroke="#265489" stroke-width="2"/>
  </g>
  <text x="555" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Trust</text>

  <!-- Emotional Safety -->
  <circle cx="665" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(665,420)">
    <path d="M0,-11 L9,-6 L9,3 C9,9 4,13 0,15 C-4,13 -9,9 -9,3 L-9,-6 Z" fill="none" stroke="#265489" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="665" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Safety</text>

  <!-- Mutual Respect -->
  <circle cx="775" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(775,420)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#265489" stroke-width="2"/>
    <line x1="0" y1="-7" x2="0" y2="0" stroke="#265489" stroke-width="2"/>
  </g>
  <text x="775" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Respect</text>

  <!-- Vulnerability -->
  <circle cx="885" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(885,420)">
    <path d="M-13,0 C-7,-9 7,-9 13,0 C7,9 -7,9 -13,0 Z" fill="none" stroke="#265489" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#265489" stroke-width="1.8"/>
  </g>
  <text x="885" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Vulnerability</text>

  <!-- Communication -->
  <circle cx="995" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(995,420)">
    <path d="M-11,-7 L11,-7 C13,-7 15,-5 15,-3 L15,3 C15,5 13,7 11,7 L-3,7 L-8,12 L-7,7 L-11,7 C-13,7 -15,5 -15,3 L-15,-3 C-15,-5 -13,-7 -11,-7 Z" fill="none" stroke="#265489" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="995" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Communication</text>

  <!-- Boundaries -->
  <circle cx="1105" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(1105,420)">
    <rect x="-12" y="-9" width="24" height="18" rx="5" fill="none" stroke="#265489" stroke-width="1.8" stroke-dasharray="3.5,3"/>
  </g>
  <text x="1105" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Boundaries</text>

  <text x="830" y="524" text-anchor="middle" font-size="13" fill="#5a6b7a">Learnable practices, not fixed traits &#8212; all can be rebuilt after damage.</text>

  <rect x="500" y="556" width="660" height="1" fill="#e4ddd0"/>
  <text x="500" y="588" font-size="11" fill="#5a6b7a">Individual, couples &amp; family counseling &#183; Gottman Method &#183; 6 CT locations</text>
</svg>
