<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>.serif { font-family: Georgia, 'Times New Roman', serif; }</style>
  </defs>

  <rect x="0" y="0" width="1200" height="628" fill="#f5f2eb"/>

  <!-- ============ LEFT PANEL ============ -->
  <rect x="0" y="0" width="460" height="628" fill="#1b3e63"/>
  <text x="230" y="54" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.8" fill="#f3e8d2">HOPEWELL HEALTH SOLUTIONS</text>

  <text x="230" y="158" text-anchor="middle" class="serif" font-size="27" font-weight="700" fill="#ffffff">Neurodivergence</text>
  <text x="230" y="194" text-anchor="middle" class="serif" font-size="27" font-weight="700" fill="#ffffff">and Suicidality</text>

  <line x1="190" y1="222" x2="270" y2="222" stroke="#b6863c" stroke-width="2"/>
  <text x="230" y="248" text-anchor="middle" font-size="13" letter-spacing="0.5" fill="#e7eef5">Inclusive Care</text>

  <text x="230" y="562" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">(860) 735-1448</text>
  <text x="230" y="594" text-anchor="middle" font-size="13" fill="#9fb6ce">hopewellhealthsolutions.com</text>

  <!-- ============ RIGHT: STAT 1 - AUTISM/IDEATION ============ -->
  <text x="500" y="76" font-size="13" font-weight="700" letter-spacing="1.8" fill="#b6863c">BY THE NUMBERS</text>

  <text x="830" y="206" text-anchor="middle" font-size="96" font-weight="700" fill="#b6863c">34.2%</text>
  <text x="830" y="240" text-anchor="middle" font-size="17" fill="#001d37">of autistic and possibly autistic adults surveyed</text>
  <text x="830" y="262" text-anchor="middle" font-size="17" fill="#001d37">had experienced suicidal ideation</text>
  <text x="830" y="284" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6b7a">Source: Newell et al., 2023, Molecular Autism</text>

  <line x1="500" y1="308" x2="1160" y2="308" stroke="#e4ddd0" stroke-width="1.5"/>

  <!-- ============ RIGHT: STAT 2 - ADHD ODDS ============ -->
  <text x="500" y="332" font-size="12" font-weight="700" letter-spacing="1.2" fill="#b6863c">ALSO ELEVATED</text>

  <text x="830" y="396" text-anchor="middle" font-size="54" font-weight="700" fill="#265489">3.3&#215;</text>
  <text x="830" y="422" text-anchor="middle" font-size="14" fill="#001d37">the odds of suicidal behavior in children and adolescents with ADHD,</text>
  <text x="830" y="442" text-anchor="middle" font-size="13" fill="#5a6b7a">compared with children without the diagnosis</text>
  <text x="830" y="464" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b7a">Source: Garas et al., 2025, Brain and Behavior</text>

  <text x="830" y="508" text-anchor="middle" font-size="13" fill="#5a6b7a">Elevated risk is not a forecast for any one person &#8212; much of what raises it can be treated.</text>

  <rect x="500" y="540" width="660" height="1" fill="#e4ddd0"/>
  <text x="500" y="572" font-size="11" fill="#5a6b7a">Individual &amp; family therapy &#183; IOP &amp; PHP available &#183; 6 CT locations</text>
</svg>
