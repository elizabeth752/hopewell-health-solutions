<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>.serif { font-family: Georgia, 'Times New Roman', serif; }</style>
  </defs>

  <rect x="0" y="0" width="1200" height="628" fill="#f5f2eb"/>

  <!-- ============ LEFT PANEL ============ -->
  <rect x="0" y="0" width="460" height="628" fill="#1b3e63"/>
  <text x="230" y="54" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.8" fill="#f3e8d2">HOPEWELL HEALTH SOLUTIONS</text>

  <text x="230" y="158" text-anchor="middle" class="serif" font-size="27" font-weight="700" fill="#ffffff">Why Do I Feel Empty?</text>
  <text x="230" y="194" text-anchor="middle" class="serif" font-size="27" font-weight="700" fill="#ffffff">Causes, Signs &amp; Treatment</text>

  <line x1="190" y1="222" x2="270" y2="222" stroke="#b6863c" stroke-width="2"/>
  <text x="230" y="248" text-anchor="middle" font-size="13" letter-spacing="0.5" fill="#e7eef5">Mental Health Care</text>

  <text x="230" y="562" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">(860) 735-1448</text>
  <text x="230" y="594" text-anchor="middle" font-size="13" fill="#9fb6ce">hopewellhealthsolutions.com</text>

  <!-- ============ RIGHT: HERO STAT ============ -->
  <text x="500" y="76" font-size="13" font-weight="700" letter-spacing="1.8" fill="#b6863c">BY THE NUMBERS</text>

  <text x="830" y="228" text-anchor="middle" font-size="100" font-weight="700" fill="#b6863c">35&#8211;70%</text>
  <text x="830" y="266" text-anchor="middle" font-size="18" fill="#001d37">of people with major depression experience anhedonia</text>
  <text x="830" y="294" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6b7a">Source: Al-Soleiti et al., 2025</text>

  <!-- ============ RIGHT: CAUSES ICON STRIP ============ -->
  <line x1="500" y1="330" x2="1160" y2="330" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="500" y="356" font-size="12" font-weight="700" letter-spacing="1.2" fill="#b6863c">WHAT CAN SIT BEHIND THE EMPTINESS</text>

  <!-- Depression -->
  <circle cx="555" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(555,420)">
    <line x1="0" y1="-11" x2="0" y2="6" stroke="#265489" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6,2 L0,10 L6,2" fill="none" stroke="#265489" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text x="555" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Depression</text>

  <!-- Unprocessed Trauma -->
  <circle cx="665" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(665,420)">
    <path d="M0,-13 L10,-5 L6,12 L-6,12 L-10,-5 Z" fill="none" stroke="#265489" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M-3,-3 L2,2 L-1,3 L4,9" fill="none" stroke="#b6863c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="665" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Trauma</text>

  <!-- Burnout -->
  <circle cx="775" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(775,420)">
    <path d="M0,-12 C5,-5 6,-1 3,3 C5,2 7,-1 7,-1 C8,5 4,12 -1,12 C-8,12 -9,5 -8,0 C-6,2 -5,2 -4,0 C-5,-3 -3,-8 0,-12 Z" fill="none" stroke="#265489" stroke-width="1.6"/>
  </g>
  <text x="775" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Burnout</text>

  <!-- Grief -->
  <circle cx="885" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(885,420)">
    <path d="M0,11 C-13,0 -12,-11 -3,-11 C-1,-11 0,-9 0,-9 C0,-9 1,-11 3,-11 C12,-11 13,0 0,11 Z" fill="none" stroke="#265489" stroke-width="1.6"/>
  </g>
  <text x="885" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Grief</text>

  <!-- Substance Use -->
  <circle cx="995" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(995,420)">
    <path d="M-7,-10 L7,-10 L5.5,11 L-5.5,11 Z" fill="none" stroke="#265489" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="-5.8" y1="-2" x2="5.8" y2="-2" stroke="#265489" stroke-width="1.8"/>
  </g>
  <text x="995" y="468" text-anchor="middle" font-size="10.5" font-weight="700" fill="#001d37">Substance Use</text>

  <!-- Isolation -->
  <circle cx="1105" cy="420" r="26" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(1105,420)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#265489" stroke-width="1.6" stroke-dasharray="2.5,3.5"/>
    <circle cx="0" cy="-2.5" r="3.2" fill="#b6863c"/>
    <path d="M-5,7.5 C-5,2 5,2 5,7.5" fill="none" stroke="#b6863c" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="1105" y="468" text-anchor="middle" font-size="11.5" font-weight="700" fill="#001d37">Isolation</text>

  <text x="830" y="524" text-anchor="middle" font-size="13" fill="#5a6b7a">Seven factors, one clinical assessment &#8212; treatment reaches all of them.</text>

  <rect x="500" y="556" width="660" height="1" fill="#e4ddd0"/>
  <text x="500" y="588" font-size="11" fill="#5a6b7a">Counseling &#183; IOP &amp; PHP &#183; TMS available &#183; 6 CT locations</text>
</svg>
