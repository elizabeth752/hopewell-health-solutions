<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>.serif { font-family: Georgia, 'Times New Roman', serif; }</style>
  </defs>

  <rect x="0" y="0" width="1200" height="628" fill="#f5f2eb"/>

  <!-- ============ LEFT PANEL ============ -->
  <rect x="0" y="0" width="460" height="628" fill="#1b3e63"/>
  <text x="230" y="54" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.8" fill="#f3e8d2">HOPEWELL HEALTH SOLUTIONS</text>

  <text x="230" y="146" text-anchor="middle" class="serif" font-size="22" font-weight="700" fill="#ffffff">Baby Blues vs.</text>
  <text x="230" y="178" text-anchor="middle" class="serif" font-size="22" font-weight="700" fill="#ffffff">Postpartum Depression</text>
  <text x="230" y="210" text-anchor="middle" class="serif" font-size="17" fill="#ffffff">How to Tell the Difference</text>

  <line x1="190" y1="236" x2="270" y2="236" stroke="#b6863c" stroke-width="2"/>
  <text x="230" y="262" text-anchor="middle" font-size="13" letter-spacing="0.5" fill="#e7eef5">Women's Mental Health</text>

  <text x="230" y="562" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">(860) 735-1448</text>
  <text x="230" y="594" text-anchor="middle" font-size="13" fill="#9fb6ce">hopewellhealthsolutions.com</text>

  <!-- ============ RIGHT: HERO STAT ============ -->
  <text x="500" y="76" font-size="13" font-weight="700" letter-spacing="1.8" fill="#b6863c">BY THE NUMBERS</text>

  <text x="760" y="212" text-anchor="middle" font-size="100" font-weight="700" fill="#b6863c">11.7%</text>
  <text x="760" y="250" text-anchor="middle" font-size="17" fill="#001d37">of Connecticut mothers with a recent birth</text>
  <text x="760" y="272" text-anchor="middle" font-size="17" fill="#001d37">report postpartum depression symptoms</text>
  <text x="760" y="296" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6b7a">Source: CDC MMWR, 2020 &#8212; nationally, about 1 in 8</text>

  <!-- ============ RIGHT: COMPARISON STRIP ============ -->
  <line x1="500" y1="330" x2="1160" y2="330" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="500" y="356" font-size="12" font-weight="700" letter-spacing="1.2" fill="#b6863c">HOW THE TWO COMPARE</text>

  <rect x="500" y="376" width="310" height="162" rx="14" fill="#e7eef5"/>
  <text x="655" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#265489">The Baby Blues</text>
  <text x="520" y="434" font-size="12.5" fill="#001d37">&#8226; Starts within days of birth</text>
  <text x="520" y="458" font-size="12.5" fill="#001d37">&#8226; Fades within two weeks</text>
  <text x="520" y="482" font-size="12.5" fill="#001d37">&#8226; Mild, comes and goes</text>
  <text x="520" y="506" font-size="12.5" fill="#001d37">&#8226; Helped by rest and time</text>

  <rect x="840" y="376" width="320" height="162" rx="14" fill="#1b3e63"/>
  <text x="1000" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Postpartum Depression</text>
  <text x="860" y="434" font-size="12.5" fill="#f3e8d2">&#8226; Can start any time in year one</text>
  <text x="860" y="458" font-size="12.5" fill="#f3e8d2">&#8226; Lasts more than two weeks</text>
  <text x="860" y="482" font-size="12.5" fill="#f3e8d2">&#8226; Heavier, more constant</text>
  <text x="860" y="506" font-size="12.5" fill="#f3e8d2">&#8226; Usually needs treatment</text>

  <text x="830" y="566" text-anchor="middle" font-size="13" fill="#5a6b7a">Not sure which one you have? That's reason enough to ask.</text>

  <rect x="500" y="580" width="660" height="1" fill="#e4ddd0"/>
  <text x="500" y="610" font-size="11" fill="#5a6b7a">Talk therapy &#183; Medication management &#183; Women's Wellness IOP &#183; 6 CT locations</text>
</svg>
