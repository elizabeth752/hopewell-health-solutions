<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>.serif { font-family: Georgia, 'Times New Roman', serif; }</style>
  </defs>

  <rect x="0" y="0" width="1200" height="628" fill="#f5f2eb"/>

  <!-- ============ LEFT PANEL ============ -->
  <rect x="0" y="0" width="460" height="628" fill="#1b3e63"/>
  <text x="230" y="54" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.8" fill="#f3e8d2">HOPEWELL HEALTH SOLUTIONS</text>

  <text x="230" y="150" text-anchor="middle" class="serif" font-size="25" font-weight="700" fill="#ffffff">Postpartum OCD &amp;</text>
  <text x="230" y="184" text-anchor="middle" class="serif" font-size="25" font-weight="700" fill="#ffffff">Intrusive Thoughts</text>

  <line x1="190" y1="212" x2="270" y2="212" stroke="#b6863c" stroke-width="2"/>
  <text x="230" y="238" text-anchor="middle" font-size="13" letter-spacing="0.5" fill="#e7eef5">Women's Mental Health</text>

  <text x="230" y="562" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">(860) 735-1448</text>
  <text x="230" y="594" text-anchor="middle" font-size="13" fill="#9fb6ce">hopewellhealthsolutions.com</text>

  <!-- ============ RIGHT: HERO STAT ============ -->
  <text x="500" y="76" font-size="13" font-weight="700" letter-spacing="1.8" fill="#b6863c">BY THE NUMBERS</text>

  <text x="830" y="206" text-anchor="middle" font-size="96" font-weight="700" fill="#b6863c">1 in 4</text>
  <text x="830" y="240" text-anchor="middle" font-size="17" fill="#001d37">new mothers reported thoughts of</text>
  <text x="830" y="262" text-anchor="middle" font-size="17" fill="#001d37">harming their baby on purpose</text>
  <text x="830" y="284" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6b7a">Source: Abramowitz et al., 2025, Psychiatry Research</text>

  <line x1="500" y1="308" x2="1160" y2="308" stroke="#e4ddd0" stroke-width="1.5"/>

  <!-- ============ RIGHT: SECONDARY STAT ============ -->
  <text x="500" y="332" font-size="12" font-weight="700" letter-spacing="1.2" fill="#b6863c">ALSO COMMON</text>

  <text x="830" y="396" text-anchor="middle" font-size="54" font-weight="700" fill="#265489">11%</text>
  <text x="830" y="422" text-anchor="middle" font-size="14" fill="#001d37">of new mothers screened positive for OCD</text>
  <text x="830" y="442" text-anchor="middle" font-size="13" fill="#5a6b7a">two weeks after birth, in one study</text>
  <text x="830" y="464" text-anchor="middle" font-size="11" font-style="italic" fill="#5a6b7a">Source: Miller et al., 2015, Journal of Women's Health</text>

  <text x="830" y="508" text-anchor="middle" font-size="13" fill="#5a6b7a">These thoughts don't mean you will act on them — and OCD is treatable.</text>

  <rect x="500" y="540" width="660" height="1" fill="#e4ddd0"/>
  <text x="500" y="572" font-size="11" fill="#5a6b7a">ERP therapy &#183; Medication management &#183; Women's Wellness IOP &#183; 6 CT locations</text>
</svg>
