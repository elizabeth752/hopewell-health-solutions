<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>.serif { font-family: Georgia, 'Times New Roman', serif; }</style>
  </defs>

  <rect x="0" y="0" width="1200" height="628" fill="#f5f2eb"/>

  <!-- ============ LEFT PANEL ============ -->
  <rect x="0" y="0" width="460" height="628" fill="#1b3e63"/>
  <text x="230" y="54" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.8" fill="#f3e8d2">HOPEWELL HEALTH SOLUTIONS</text>

  <text x="230" y="150" text-anchor="middle" class="serif" font-size="25" font-weight="700" fill="#ffffff">Postpartum Anxiety</text>
  <text x="230" y="184" text-anchor="middle" class="serif" font-size="20" fill="#ffffff">Symptoms, Duration &amp;</text>
  <text x="230" y="212" text-anchor="middle" class="serif" font-size="20" fill="#ffffff">Treatment</text>

  <line x1="190" y1="240" x2="270" y2="240" stroke="#b6863c" stroke-width="2"/>
  <text x="230" y="266" text-anchor="middle" font-size="13" letter-spacing="0.5" fill="#e7eef5">Women's Mental Health</text>

  <text x="230" y="562" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">(860) 735-1448</text>
  <text x="230" y="594" text-anchor="middle" font-size="13" fill="#9fb6ce">hopewellhealthsolutions.com</text>

  <!-- ============ RIGHT: HERO STAT ============ -->
  <text x="500" y="76" font-size="13" font-weight="700" letter-spacing="1.8" fill="#b6863c">BY THE NUMBERS</text>

  <text x="830" y="220" text-anchor="middle" font-size="110" font-weight="700" fill="#b6863c">1 in 5</text>
  <text x="830" y="260" text-anchor="middle" font-size="18" fill="#001d37">new mothers in the U.S. report</text>
  <text x="830" y="284" text-anchor="middle" font-size="18" fill="#001d37">postpartum anxiety symptoms</text>
  <text x="830" y="310" text-anchor="middle" font-size="12" font-style="italic" fill="#5a6b7a">Source: America's Health Rankings, CDC PRAMS 2023</text>

  <!-- ============ RIGHT: SIGNS STRIP ============ -->
  <line x1="500" y1="344" x2="1160" y2="344" stroke="#e4ddd0" stroke-width="1.5"/>
  <text x="500" y="370" font-size="12" font-weight="700" letter-spacing="1.2" fill="#b6863c">SIGNS SHOW UP IN THREE PLACES</text>

  <!-- Thoughts -->
  <circle cx="610" cy="434" r="32" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(610,434)">
    <path d="M-12,2 C-14,-7 -6,-13 2,-11 C7,-14 15,-9 13,-2 C17,-1 17,6 11,7 C11,11 5,13 1,10 C-3,13 -10,12 -11,7 C-17,8 -19,3 -12,2 Z" fill="none" stroke="#265489" stroke-width="1.8"/>
    <circle cx="-15" cy="11" r="2" fill="#265489"/>
  </g>
  <text x="610" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#001d37">Thoughts</text>

  <!-- Body -->
  <circle cx="720" cy="434" r="32" fill="#ffffff" stroke="#b6863c" stroke-width="2"/>
  <g transform="translate(720,434)">
    <path d="M-11,1 L-5,1 L-2,-7 L2,9 L5,1 L11,1" fill="none" stroke="#b6863c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="720" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#001d37">Body</text>

  <!-- Behavior -->
  <circle cx="830" cy="434" r="32" fill="#ffffff" stroke="#5c7c6b" stroke-width="2"/>
  <g transform="translate(830,434)">
    <circle cx="-3" cy="-3" r="10" fill="none" stroke="#5c7c6b" stroke-width="1.8"/>
    <line x1="5" y1="5" x2="13" y2="13" stroke="#5c7c6b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="830" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#001d37">Behavior</text>

  <!-- Treatable -->
  <circle cx="940" cy="434" r="32" fill="#ffffff" stroke="#265489" stroke-width="2"/>
  <g transform="translate(940,434)">
    <path d="M-10,0 C-10,-8 -3,-11 0,-6 C3,-11 10,-8 10,0 C10,6 3,10 0,13 C-3,10 -10,6 -10,0 Z" fill="#265489" opacity="0.85"/>
  </g>
  <text x="940" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#001d37">Treatable</text>

  <text x="830" y="538" text-anchor="middle" font-size="13" fill="#5a6b7a">The signs, how long it lasts, and when to get help.</text>

  <rect x="500" y="570" width="660" height="1" fill="#e4ddd0"/>
  <text x="500" y="602" font-size="11" fill="#5a6b7a">Individual therapy &#183; Medication management &#183; Women's Wellness IOP &#183; 6 CT locations</text>
</svg>
